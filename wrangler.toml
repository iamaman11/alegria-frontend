name = "alegria-frontend"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next"

# KV namespace for ISR cache - CRITICAL for dynamic routes [slug] on Cloudflare Pages
# Without this binding, OpenNext cannot store ISR cache and dynamic routes fail
[[kv_namespaces]]
binding = "NEXT_CACHE_KV"
id = "c92e174e58cd40f792b554d37ec6db53"
preview_id = "c92e174e58cd40f792b554d37ec6db53"

[vars]
# Environment identification
ENVIRONMENT = "production"

# API Configuration - MUST be NEXT_PUBLIC for client-side access
# These are injected during build and runtime
NEXT_PUBLIC_API_URL = "https://api.poshta.cloud"
NEXT_PUBLIC_SITE_URL = "https://poshta.cloud"

# Legacy API_URL for backward compatibility (if needed)
API_URL = "https://api.poshta.cloud"
