name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cache-migration-preview  # Preview branch для тестирования cache миграции
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  NPM_REGISTRY: "https://registry.npmjs.org"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        run: echo "PNPM_HOME=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext
        run: pnpm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.poshta.cloud' }}

      - name: Prepare .open-next for Pages deployment
        run: |
          cd .open-next
          # Copy static assets to root for Cloudflare Pages
          cp -r assets/* .
          # Rename worker.js to _worker.js (required for Pages)
          mv worker.js _worker.js
          # Create _routes.json for static asset routing
          cat > _routes.json << 'EOF'
          {
            "version": 1,
            "description": "Static assets should bypass Worker",
            "include": ["/*"],
            "exclude": [
              "/_next/static/*",
              "/favicon.ico",
              "/favicon.svg",
              "/robots.txt",
              "/sitemap.xml",
              "/pages-sitemap.xml",
              "/posts-sitemap.xml",
              "/file.svg",
              "/globe.svg",
              "/next.svg",
              "/vercel.svg",
              "/window.svg"
            ]
          }
          EOF

      - name: Strip Queues/Consumers from wrangler.toml for Pages
        # Workaround: if the account doesn't have Cloudflare Queues enabled,
        # wrangler will fail when publishing consumers. Remove queues/consumers
        # from the generated wrangler.toml before calling `wrangler pages deploy`.
        run: |
          cd .open-next
          if [ -f wrangler.toml ]; then
            awk 'BEGIN{skip=0}
            /^\[\[queues.producers\]\]/{skip=1;next}
            /^\[consumers\]/{skip=1;next}
            /^\[[a-zA-Z0-9_]+\]/{if(skip==1 && $0=="[vars]"){skip=0; print $0; next}} 
            { if(!skip) print }
            ' wrangler.toml > wrangler.cleaned.toml || cp wrangler.toml wrangler.cleaned.toml
            mv wrangler.cleaned.toml wrangler.toml
            echo "Stripped queues/consumers from .open-next/wrangler.toml"
          else
            echo "No wrangler.toml found in .open-next, skipping strip step"
          fi

      - name: Initialize D1 Tables (first deployment only)
        run: |
          npx wrangler d1 execute nextjs-tag-cache --remote --command "CREATE TABLE IF NOT EXISTS tags (tag TEXT NOT NULL, path TEXT NOT NULL, UNIQUE(tag, path) ON CONFLICT REPLACE)"
          npx wrangler d1 execute nextjs-tag-cache --remote --command "CREATE TABLE IF NOT EXISTS revalidations (tag TEXT NOT NULL, revalidatedAt INTEGER NOT NULL, UNIQUE(tag) ON CONFLICT REPLACE)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Populate D1 tags table with build-time cache data
        run: |
          npx wrangler d1 execute nextjs-tag-cache --remote --file .open-next/cloudflare/cache-assets-manifest.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note on ISR Cache Population
        run: |
          echo "[INFO] ISR Cache Auto-Population Strategy"
          echo "=========================================="
          echo ""
          echo "OpenNext 1.11.0 with Next.js 16:"
          echo "- R2 cache pre-population is OPTIONAL (not required for production)"
          echo "- Cache is automatically populated on first request to each page"
          echo "- Architecture: Cache API (regional) → R2 (persistent) → On-demand generation"
          echo ""
          echo "Benefits of this approach:"
          echo "- No need to pre-upload cache files (avoids path encoding issues)"
          echo "- Dynamic cache management: only cached pages that are accessed"
          echo "- Reduces initial deployment time"
          echo ""
          echo "References:"
          echo "- R2IncrementalCache.set() saves to R2 on every generation"
          echo "- RegionalCache.get() checks Cache API first, then R2"
          echo "- ISR revalidation managed via D1 tags table"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next --project-name=alegria-frontend

      - name: Purge Cloudflare Cache
        if: success()
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://poshta.cloud/","https://poshta.cloud/*"]}'
          echo "[OK] Cache purge initiated"

      - name: Create deployment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ job.status }}',
              environment_url: 'https://poshta.cloud',
              description: 'Deployed to Cloudflare Pages'
            });
