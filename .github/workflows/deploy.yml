name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cache-migration-preview  # Preview branch для тестирования cache миграции
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  NPM_REGISTRY: "https://registry.npmjs.org"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: npm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.poshta.cloud' }}

      - name: Populate R2 Incremental Cache
        run: npx @opennextjs/cloudflare populateCache remote --config=wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare .open-next for Pages deployment
        run: |
          cd .open-next
          # Copy static assets to root for Cloudflare Pages
          cp -r assets/* .
          # Rename worker.js to _worker.js (required for Pages)
          mv worker.js _worker.js
          # Create _routes.json for static asset routing
          cat > _routes.json << 'EOF'
          {
            "version": 1,
            "description": "Static assets should bypass Worker",
            "include": ["/*"],
            "exclude": [
              "/_next/static/*",
              "/favicon.ico",
              "/favicon.svg",
              "/robots.txt",
              "/sitemap.xml",
              "/pages-sitemap.xml",
              "/posts-sitemap.xml",
              "/file.svg",
              "/globe.svg",
              "/next.svg",
              "/vercel.svg",
              "/window.svg"
            ]
          }
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next --project-name=alegria-frontend

      - name: Set Pages Environment Variables (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list

      - name: Configure Environment Variables via wrangler
        run: |
          # Note: wrangler pages deployment env vars must be set through Cloudflare UI or API
          # For now, passing through build-time environment for pages functions
          echo "[INFO] Environment variables will be set via Cloudflare Pages UI"
          echo "Required secrets for production:"
          echo "  - CLOUDFLARE_API_TOKEN"
          echo "  - CLOUDFLARE_ZONE_ID"
          echo "  - WEBHOOK_SECRET"

      - name: Purge Cloudflare Cache
        if: success()
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://poshta.cloud/","https://poshta.cloud/*"]}'
          echo "[OK] Cache purge initiated"

      - name: Create deployment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ job.status }}',
              environment_url: 'https://poshta.cloud',
              description: 'Deployed to Cloudflare Pages'
            });
