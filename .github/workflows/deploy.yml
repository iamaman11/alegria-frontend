name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cache-migration-preview  # Preview branch для тестирования cache миграции
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  NPM_REGISTRY: "https://registry.npmjs.org"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: npm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.poshta.cloud' }}

      - name: Prepare .open-next for Pages deployment
        run: |
          cd .open-next
          # Copy static assets to root for Cloudflare Pages
          cp -r assets/* .
          # Rename worker.js to _worker.js (required for Pages)
          mv worker.js _worker.js
          # Create _routes.json for static asset routing
          cat > _routes.json << 'EOF'
          {
            "version": 1,
            "description": "Static assets should bypass Worker",
            "include": ["/*"],
            "exclude": [
              "/_next/static/*",
              "/favicon.ico",
              "/favicon.svg",
              "/robots.txt",
              "/sitemap.xml",
              "/pages-sitemap.xml",
              "/posts-sitemap.xml",
              "/file.svg",
              "/globe.svg",
              "/next.svg",
              "/vercel.svg",
              "/window.svg"
            ]
          }
          EOF

      - name: Initialize D1 Tables (first deployment only)
        run: |
          npx wrangler d1 execute nextjs-tag-cache --remote --command "CREATE TABLE IF NOT EXISTS tags (tag TEXT NOT NULL, path TEXT NOT NULL, UNIQUE(tag, path) ON CONFLICT REPLACE)"
          npx wrangler d1 execute nextjs-tag-cache --remote --command "CREATE TABLE IF NOT EXISTS revalidations (tag TEXT NOT NULL, revalidatedAt INTEGER NOT NULL, UNIQUE(tag) ON CONFLICT REPLACE)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Populate D1 tags table with build-time cache data
        run: |
          npx wrangler d1 execute nextjs-tag-cache --remote --file .open-next/cloudflare/cache-assets-manifest.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload cache assets to R2 for ISR prewarming
        run: |
          echo "[INFO] Uploading cache files to R2..."
          count=0
          for file in $(find .open-next/cache -name "*.cache"); do
            relative_path="${file#.open-next/cache/}"
            npx wrangler r2 object put "nextjs-incremental-cache/${relative_path}" --file="${file}" --remote
            count=$((count+1))
          done
          echo "[OK] Uploaded $count cache files to R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next --project-name=alegria-frontend

      - name: Purge Cloudflare Cache
        if: success()
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://poshta.cloud/","https://poshta.cloud/*"]}'
          echo "[OK] Cache purge initiated"

      - name: Create deployment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ job.status }}',
              environment_url: 'https://poshta.cloud',
              description: 'Deployed to Cloudflare Pages'
            });
